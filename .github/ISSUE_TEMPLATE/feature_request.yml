name: Feature request
description: Propose a generator option, integration, or maintenance improvement.
title: "[Feature]: "
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user need is not met today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Include interactive and non-interactive generator behavior.
    validations:
      required: true
  - type: textarea
    id: matrix
    attributes:
      label: Combination and compatibility impact
      description: Explain auth, ORM, payments, optional-feature, Node, and Next.js interactions.
  - type: textarea
    id: security
    attributes:
      label: Security, maintenance, and licensing impact
      description: Identify trust boundaries, new dependencies, copied assets, and long-term upkeep.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
